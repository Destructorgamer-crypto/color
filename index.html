<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Colores con Sonidos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #222;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #game-container {
            text-align: center;
        }

        #color-box {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: background-color 0.3s ease;
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background-color: #4CAF50;
            color: white;
            margin: 10px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #score {
            font-size: 24px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>¡Adivina el Color!</h1>
        <div id="color-box" style="background-color: #3498db;"></div>
        <p id="color-name">Cargando...</p>
        
        <div id="buttons-container">
            </div>

        <div id="score">Puntuación: 0</div>
    </div>

    <script>
        // Generación de sonidos usando la Web Audio API (sin dependencias externas)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(freq, type, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = type; // 'sine', 'square', 'triangle', 'sawtooth'
            osc.frequency.value = freq;
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Sonidos específicos del otro juego
        const soundEffects = {
            correct: () => playSound(600, 'triangle', 0.3),
            wrong: () => playSound(200, 'square', 0.4),
            start: () => playSound(440, 'sine', 0.5)
        };

        // Lógica del juego
        const colors = [
            { name: "Rojo", hex: "#e74c3c" },
            { name: "Azul", hex: "#3498db" },
            { name: "Verde", hex: "#2ecc71" },
            { name: "Amarillo", hex: "#f1c40f" },
            { name: "Púrpura", hex: "#9b59b6" },
            { name: "Naranja", hex: "#e67e22" }
        ];

        let score = 0;
        let targetColor = {};

        const colorBox = document.getElementById('color-box');
        const colorNameText = document.getElementById('color-name');
        const buttonsContainer = document.getElementById('buttons-container');
        const scoreDisplay = document.getElementById('score');

        function nextRound() {
            // Seleccionar color objetivo (nombre a mostrar)
            const targetNameIndex = Math.floor(Math.random() * colors.length);
            targetColor = colors[targetNameIndex];
            colorNameText.innerText = `¿Cuál es el color "${targetColor.name}"?`;

            // Mezclar opciones visuales (cajas de colores)
            // Nos aseguramos de incluir el color correcto y rellenar con otros aleatorios
            let options = [targetColor];
            while(options.length < 3) {
                let randomColor = colors[Math.floor(Math.random() * colors.length)];
                if(!options.includes(randomColor)) {
                    options.push(randomColor);
                }
            }
            // Barajar las opciones
            options.sort(() => Math.random() - 0.5);

            // Renderizar botones
            buttonsContainer.innerHTML = '';
            options.forEach(color => {
                const btn = document.createElement('button');
                btn.classList.add('btn');
                btn.style.backgroundColor = color.hex;
                btn.onclick = () => checkAnswer(color.name);
                buttonsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedName) {
            if (selectedName === targetColor.name) {
                score += 10;
                soundEffects.correct();
            } else {
                score = Math.max(0, score - 5);
                soundEffects.wrong();
            }
            scoreDisplay.innerText = `Puntuación: ${score}`;
            nextRound();
        }

        // Iniciar el juego
        soundEffects.start();
        nextRound();
    </script>
</body>
</html>
