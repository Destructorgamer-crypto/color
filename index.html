<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --bg: #0d0d0d; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #game-container { width: 320px; text-align: center; }
        #preview { width: 100%; height: 180px; border-radius: 12px; margin-bottom: 24px; transition: background 0.2s; }
        .controls { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        input[type=range] { width: 100%; height: 6px; accent-color: #fff; cursor: pointer; }
        button { background: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; }
        #score-display { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="preview"></div>
    <div id="ui-area">
        <div id="status-text">Memoriza el color...</div>
        <div id="controls" style="display:none;">
            <input type="range" id="h" min="0" max="360" value="0">
            <input type="range" id="s" min="0" max="100" value="50">
            <input type="range" id="l" min="0" max="100" value="50">
            <button onclick="check()">LISTO</button>
        </div>
    </div>
</div>

<script>
    let target = {h:0, s:0, l:0};
    const preview = document.getElementById('preview');
    
    function start() {
        target = { h: Math.floor(Math.random()*360), s: Math.floor(Math.random()*100), l: Math.floor(Math.random()*100) };
        preview.style.backgroundColor = `hsl(${target.h}, ${target.s}%, ${target.l}%)`;
        document.getElementById('status-text').innerText = "Memoriza el color...";
        document.getElementById('controls').style.display = 'none';
        
        setTimeout(() => {
            preview.style.backgroundColor = '#333';
            document.getElementById('status-text').innerText = "Adivina:";
            document.getElementById('controls').style.display = 'block';
        }, 3000);
    }

    // Actualización en tiempo real
    document.querySelectorAll('input').forEach(i => i.addEventListener('input', () => {
        preview.style.backgroundColor = `hsl(${document.getElementById('h').value}, ${document.getElementById('s').value}%, ${document.getElementById('l').value}%)`;
    }));

    function check() {
        const h = document.getElementById('h').value;
        const s = document.getElementById('s').value;
        const l = document.getElementById('l').value;
        const diff = Math.abs(h-target.h) + Math.abs(s-target.s) + Math.abs(l-target.l);
        const score = Math.max(0, 300 - diff);
        document.getElementById('ui-area').innerHTML = `<div id="score-display">${Math.round(score)}</div><button onclick="location.reload()">JUGAR OTRA VEZ</button>`;
    }
    
    start();
</script>
</body>
</html>
