<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>INDEXUM - Color game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

        :root {
            --bg-page: #ffffff;
            --text-main: #000000;
            --popup-bg: #09090b;
            --popup-text: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-page); color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; user-select: none; -webkit-user-select: none;
        }

        /* Utilidad de Animaciones */
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .fade-out { animation: fadeOut 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.05); } }
        
        /* Pantalla de Inicio */
        #start-screen { text-align: center; }
        #start-screen h1 { font-size: 3rem; font-weight: 900; margin-bottom: 10px; letter-spacing: -2px; }
        #start-btn {
            background: #000; color: #fff; border: none;
            padding: 15px 40px; font-size: 1.2rem; font-weight: 800;
            border-radius: 30px; cursor: pointer; transition: transform 0.1s;
        }
        #start-btn:active { transform: scale(0.95); }

        /* Pantalla de Juego (Caja Principal) */
        #game-screen { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        #game-box {
            position: relative;
            width: 90vmin; height: 90vmin; max-width: 600px; max-height: 600px;
            border-radius: 32px; background-color: #333;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden; transition: background-color 0.1s;
        }

        /* Headers en el juego */
        .game-header {
            position: absolute; top: 25px; width: 100%;
            display: flex; justify-content: space-between;
            padding: 0 35px; box-sizing: border-box;
            color: rgba(255,255,255,0.7); font-weight: 800; z-index: 10;
        }
        
        /* Contador Central */
        #timer {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem; font-weight: 900; color: #fff;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
            font-variant-numeric: tabular-nums; letter-spacing: -4px;
        }

        /* Sliders Personalizados */
        #sliders-container {
            position: absolute; left: 20px; top: 50%;
            transform: translateY(-50%); display: flex; gap: 15px; height: 70%; z-index: 10;
        }
        .slider-track {
            position: relative; width: 28px; height: 100%;
            border-radius: 14px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
            touch-action: none; cursor: pointer;
        }
        .slider-thumb {
            position: absolute; width: 20px; height: 20px;
            background: #fff; border-radius: 50%;
            left: 4px; top: 50%; transform: translateY(-50%);
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            pointer-events: none; transition: transform 0.05s;
        }

        /* Botón Confirmar (Bottom Right) */
        #submit-btn {
            position: absolute; bottom: 30px; right: 30px;
            width: 70px; height: 70px; border-radius: 50%;
            background: rgba(255,255,255,0.9); border: none;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.1s; z-index: 10;
        }
        #submit-btn:active { transform: scale(0.9); }
        #submit-btn svg { width: 30px; height: 30px; fill: #000; }

        /* --- PANTALLA FINAL (Clon de la Imagen 2) --- */
        #result-screen { position: absolute; z-index: 100; display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(5px); }
        .popup-card {
            background: var(--popup-bg); color: var(--popup-text);
            width: 90%; max-width: 420px; border-radius: 24px;
            padding: 30px; box-sizing: border-box; box-shadow: 0 25px 80px rgba(0,0,0,0.8);
            position: relative;
        }
        .popup-header { display: flex; justify-content: space-between; font-size: 13px; color: #888; font-weight: 600; margin-bottom: 20px; }
        .close-btn { background: #333; border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 12px; }
        
        .score-huge { display: flex; align-items: baseline; letter-spacing: -2px; margin-bottom: 5px; }
        .score-huge .num { font-size: 5rem; font-weight: 900; }
        .score-huge .total { font-size: 2.5rem; color: #555; font-weight: 800; }
        .sarcastic-text { color: #888; font-size: 14px; font-weight: 600; margin-bottom: 25px; line-height: 1.4; }

        .breakdown-box { border: 1.5px solid #222; border-radius: 16px; padding: 15px; margin-bottom: 20px; }
        .breakdown-header { display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; margin-bottom: 15px; }
        .breakdown-header span:last-child { color: #ccc; }
        
        .history-grid { display: flex; gap: 4px; height: 75px; }
        .history-item { flex: 1; position: relative; overflow: hidden; }
        .history-item:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        .history-item:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }
        .history-score { position: absolute; top: 6px; left: 6px; font-size: 11px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); z-index: 2; }

        .popup-actions { display: flex; gap: 10px; }
        .popup-actions button { flex: 1; padding: 15px; border-radius: 30px; font-weight: 800; font-size: 14px; border: none; cursor: pointer; }
        .btn-outline { background: transparent; color: #fff; border: 1.5px solid #fff !important; flex: 0.4 !important; }
        .btn-white { background: #fff; color: #000; }
    </style>
</head>
<body>

    <!-- Inicio -->
    <div id="start-screen" class="fade-in">
        <h1>Dialed Color</h1>
        <button id="start-btn" onclick="initGame()">JUGAR</button>
    </div>

    <!-- Juego -->
    <div id="game-screen" class="hidden">
        <div id="game-box">
            <div class="game-header">
                <div>dialed.gg</div>
                <div id="round-indicator">1 / 5</div>
            </div>
            
            <div id="timer">500</div>
            
            <div id="sliders-container" class="hidden">
                <div class="slider-track" id="track-h"><div class="slider-thumb"></div></div>
                <div class="slider-track" id="track-s"><div class="slider-thumb"></div></div>
                <div class="slider-track" id="track-l"><div class="slider-thumb"></div></div>
            </div>

            <button id="submit-btn" class="hidden" onclick="submitGuess()">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v4h-2zm0 6h2v2h-2z" transform="rotate(45, 12, 12)"/></svg>
            </button>
        </div>
    </div>

    <!-- Resultados (Copia de la imagen) -->
    <div id="result-screen" class="hidden">
        <div class="popup-card fade-in">
            <div class="popup-header">
                <div>#7.298.206 / <span style="color: #666">7.411.881</span></div>
                <div class="close-btn" onclick="location.reload()">X</div>
            </div>
            <div class="score-huge">
                <div class="num" id="final-score">0.00</div>
                <div class="total">/50</div>
            </div>
            <div class="sarcastic-text" id="sarcastic-text">Mediocre. The off-white of achievement. The eggshell of ambition.</div>
            
            <div class="breakdown-box">
                <div class="breakdown-header">
                    <span>ELA</span>
                    <span id="final-score-small">0.00/50</span>
                </div>
                <div class="history-grid" id="history-grid">
                    <!-- Se llena con JS -->
                </div>
            </div>

            <div class="popup-actions">
                <button class="btn-outline" onclick="location.reload()">ELA</button>
                <button class="btn-white" onclick="initGame()">Play Again</button>
            </div>
        </div>
    </div>
