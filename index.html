<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick V1 - Estilo Dialed.gg (HSL)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
            margin-bottom: 10px;
        }

        .game-board {
            display: flex;
            gap: 40px;
            background: #2d2d2d;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .box-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .color-box {
            width: 180px;
            height: 180px;
            border-radius: 10px;
            border: 2px solid #444;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            width: 250px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-weight: bold;
            font-size: 14px;
        }

        /* Degradados visuales en las barras para identificar el efecto */
        #hue-slider {
            accent-color: #ff3366;
            background: linear-gradient(to right, red, yellow, green, cyan, blue, magenta, red);
            height: 6px;
            border-radius: 3px;
            outline: none;
            appearance: none;
        }
        #saturation-slider {
            accent-color: #85bb65;
            background: linear-gradient(to right, #808080, #00ff00);
            height: 6px;
            border-radius: 3px;
            outline: none;
            appearance: none;
        }
        #lightness-slider {
            accent-color: #3498db;
            background: linear-gradient(to right, #000000, #808080, #ffffff);
            height: 6px;
            border-radius: 3px;
            outline: none;
            appearance: none;
        }

        .btn-container {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #4a6fa5;
            color: white;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #3f5d8a;
        }

        button:active {
            transform: scale(0.96);
        }

        .score-board {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Brick V1: Dialed HSL</h1>
    
    <div class="game-board">
        <div class="box-container">
            <h3>Objetivo</h3>
            <div class="color-box" id="target-box"></div>
            <span>Memoriza este color</span>
        </div>

        <div class="box-container">
            <h3>Tu Color</h3>
            <div class="color-box" id="user-box"></div>
            
            <div class="controls">
                <div class="control-group">
                    <label for="hue-slider">Tono (Hue): <span id="hue-val">0</span>°</label>
                    <input type="range" id="hue-slider" min="0" max="360" value="0">
                </div>
                <div class="control-group">
                    <label for="saturation-slider">Saturación: <span id="saturation-val">0</span>%</label>
                    <input type="range" id="saturation-slider" min="0" max="100" value="0">
                </div>
                <div class="control-group">
                    <label for="lightness-slider">Intensidad (Lightness): <span id="lightness-val">0</span>%</label>
                    <input type="range" id="lightness-slider" min="0" max="100" value="0">
                </div>
            </div>
        </div>
    </div>

    <div class="btn-container">
        <button id="check-btn">Comprobar</button>
        <button id="reset-btn">Siguiente</button>
    </div>

    <div class="score-board">Puntos: <span id="score">0</span></div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(freq, type, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = type; 
            osc.frequency.value = freq;
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const soundEffects = {
            correct: () => playSound(600, 'triangle', 0.3),
            wrong: () => playSound(200, 'square', 0.4),
            start: () => playSound(440, 'sine', 0.5)
        };

        // Lógica del juego HSL
        let targetH = 0, targetS = 0, targetL = 0;
        let score = 0;

        const targetBox = document.getElementById('target-box');
        const userBox = document.getElementById('user-box');
        
        const hueSlider = document.getElementById('hue-slider');
        const saturationSlider = document.getElementById('saturation-slider');
        const lightnessSlider = document.getElementById('lightness-slider');

        const hueVal = document.getElementById('hue-val');
        const saturationVal = document.getElementById('saturation-val');
        const lightnessVal = document.getElementById('lightness-val');
        
        const scoreDisplay = document.getElementById('score');

        function generateTargetColor() {
            // Tono de 0 a 360, Saturación e Intensidad de 20% a 80% para evitar grises o blancos absolutos imposibles de adivinar
            targetH = Math.floor(Math.random() * 361);
            targetS = Math.floor(Math.random() * 61) + 20; 
            targetL = Math.floor(Math.random() * 61) + 20;
            
            targetBox.style.backgroundColor = `hsl(${targetH}, ${targetS}%, ${targetL}%)`;
        }

        function updateUsersColor() {
            const h = hueSlider.value;
            const s = saturationSlider.value;
            const l = lightnessSlider.value;

            hueVal.innerText = h;
            saturationVal.innerText = s;
            lightnessVal.innerText = l;

            userBox.style.backgroundColor = `hsl(${h}, ${s}%, ${l}%)`;
        }

        hueSlider.addEventListener('input', updateUsersColor);
        saturationSlider.addEventListener('input', updateUsersColor);
        lightnessSlider.addEventListener('input', updateUsersColor);

        document.getElementById('check-btn').addEventListener('click', () => {
            const currentH = parseInt(hueSlider.value);
            const currentS = parseInt(saturationSlider.value);
            const currentL = parseInt(lightnessSlider.value);

            // Tolerancia estricta para el modo entrenamiento (Tono +/- 8, Saturación +/- 10, Intensidad +/- 10)
            const toleranceH = 8;
            const toleranceS = 10;
            const toleranceL = 10;

            // Manejo del caso circular del Tono (0 y 360 grados son el mismo punto)
            let diffH = Math.abs(currentH - targetH);
            if (diffH > 180) diffH = 360 - diffH;

            if (
                diffH <= toleranceH &&
                Math.abs(currentS - targetS) <= toleranceS &&
                Math.abs(currentL - targetL) <= toleranceL
            ) {
                score += 20;
                soundEffects.correct();
                alert("¡Tono, Saturación e Intensidad clavados!");
                resetGame();
            } else {
                score = Math.max(0, score - 10);
                soundEffects.wrong();
                alert("¡Te has desviado! Sigue ajustando o pasa al siguiente.");
            }
            scoreDisplay.innerText = score;
        });

        function resetGame() {
            generateTargetColor();
            // Resetear barras a valores neutrales de inicio
            hueSlider.value = 0;
            saturationSlider.value = 0;
            lightnessSlider.value = 0;
            updateUsersColor();
        }

        document.getElementById('reset-btn').addEventListener('click', () => {
            resetGame();
        });

        // Inicialización
        soundEffects.start();
        resetGame();
    </script>
</body>
</html>
